apply plugin: 'com.android.application'

/*
 * Upload-key material, kept out of the repository.
 *
 * `keystore.properties` sits next to this file, is listed in .gitignore, and
 * holds the four values below. It is deliberately absent from a fresh clone:
 * an upload key cannot be rotated once Google Play has seen it, so losing or
 * leaking it means never shipping an update to this listing again.
 *
 * When the file is missing — a clean checkout, CI without secrets, anyone
 * building to try the app — the release build still assembles, just unsigned.
 * That keeps `assembleRelease` useful for checking the build without handing
 * every contributor the production key.
 *
 * See docs/ANDROID_SIGNING.md for the one command that creates it.
 */
def keystorePropertiesFile = rootProject.file("app/keystore.properties")
def keystoreProperties = new Properties()
def hasSigningConfig = keystorePropertiesFile.exists()
if (hasSigningConfig) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.pdfhelper.indianformhelper"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.pdfhelper.indianformhelper"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasSigningConfig) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Only attached when the key is actually present, so a clean
            // checkout builds unsigned rather than failing on a missing file.
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
            /*
             * R8, in shrink-and-obfuscate mode.
             *
             * Nearly all of this app is web assets, so the win here is modest
             * by construction: R8 only ever sees the Capacitor bridge, the ten
             * plugins and their transitive AndroidX/Play-Billing/RevenueCat
             * dependencies. That is still a few thousand unused library
             * classes and methods that were being shipped for no reason.
             *
             * Plugins are found by reflection -- Capacitor reads class names
             * out of `capacitor.plugins.json` at runtime -- so shrinking them
             * away is the obvious way for this to break. The keep rules that
             * prevent it ship with capacitor-android as consumer rules
             * (`-keep public class * extends com.getcapacitor.Plugin`), so
             * they apply automatically; `proguard-rules.pro` only adds what
             * those do not cover.
             *
             * `proguard-android.txt` rather than the `-optimize` variant on
             * purpose: the extra inlining and class merging would buy almost
             * nothing on a code base this thin, and every one of those
             * transformations is another way for reflective plugin dispatch to
             * stop resolving. Resource shrinking is likewise left off -- the
             * icons and splash screens are referenced from the manifest and
             * from JS by name, which `shrinkResources` cannot see.
             */
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
