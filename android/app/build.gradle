apply plugin: 'com.android.application'

/*
 * Upload-key material, kept out of the repository.
 *
 * `keystore.properties` sits next to this file, is listed in .gitignore, and
 * holds the four values below. It is deliberately absent from a fresh clone:
 * an upload key cannot be rotated once Google Play has seen it, so losing or
 * leaking it means never shipping an update to this listing again.
 *
 * When the file is missing — a clean checkout, CI without secrets, anyone
 * building to try the app — the release build still assembles, just unsigned.
 * That keeps `assembleRelease` useful for checking the build without handing
 * every contributor the production key.
 *
 * See docs/ANDROID_SIGNING.md for the one command that creates it.
 */
def keystorePropertiesFile = rootProject.file("app/keystore.properties")
def keystoreProperties = new Properties()
def hasSigningConfig = keystorePropertiesFile.exists()
if (hasSigningConfig) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.pdfhelper.indianformhelper"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.pdfhelper.indianformhelper"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "1.0.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasSigningConfig) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Only attached when the key is actually present, so a clean
            // checkout builds unsigned rather than failing on a missing file.
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
            /*
             * R8, in shrink-and-obfuscate mode.
             *
             * Nearly all of this app is web assets, so the win here is modest
             * by construction: R8 only ever sees the Capacitor bridge, the ten
             * plugins and their transitive AndroidX/Play-Billing/RevenueCat
             * dependencies. That is still a few thousand unused library
             * classes and methods that were being shipped for no reason.
             *
             * Plugins are found by reflection -- Capacitor reads class names
             * out of `capacitor.plugins.json` at runtime -- so shrinking them
             * away is the obvious way for this to break. The keep rules that
             * prevent it ship with capacitor-android as consumer rules
             * (`-keep public class * extends com.getcapacitor.Plugin`), so
             * they apply automatically; `proguard-rules.pro` only adds what
             * those do not cover.
             *
             * `proguard-android.txt` rather than the `-optimize` variant on
             * purpose: the extra inlining and class merging would buy almost
             * nothing on a code base this thin, and every one of those
             * transformations is another way for reflective plugin dispatch to
             * stop resolving.
             *
             * `shrinkResources` is off, and this is a measured decision rather
             * than an assumption. Turning it on builds cleanly and takes the
             * APK from 7,825,100 to 6,966,807 bytes -- 858 kB, about 11% --
             * with every launcher, round-icon and splash resource still
             * resolving (checked with `aapt2 dump badging`, which reports the
             * same icon resource either way).
             *
             * What stops it shipping is one line in the shrinker's own report:
             * `android.content.res.Resources#getIdentifier present: true`.
             * Something in the dependency graph resolves resources by name at
             * runtime, and the likeliest owner is RevenueCat, whose paywall is
             * the one flow that cannot be exercised from a desktop build. AGP
             * does fall back to a conservative mode when it sees that call, so
             * the risk is small -- but the failure it protects against is a
             * missing resource in the purchase flow, found by a customer.
             *
             * Turn it on once someone can install a release build and complete
             * a purchase on a device. It is a one-line change and the 858 kB
             * is worth having.
             */
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

/*
 * Refuses to package a release that still carries the placeholder store key.
 *
 * `store.config.ts` ships `goog_XXXXX` until someone pastes the real
 * RevenueCat key in, and the app handles that honestly at runtime -- the
 * paywall reports `not-configured` rather than opening a sheet that cannot
 * complete. What it cannot do is stop the bundle being uploaded. A signed
 * `.aab` built before the key landed is indistinguishable from a good one by
 * eye: same size, same `jar verified`, same version. The only difference is a
 * string buried in a hashed JS chunk, and the first report of it is a tester
 * saying the buy button does nothing.
 *
 * The check reads the *synced web assets* rather than the TypeScript source,
 * because those are what actually get packaged. Editing `store.config.ts` and
 * forgetting `npx cap sync android` is its own version of this same bug, and
 * reading the assets catches both.
 *
 * Release only. Debug builds with a placeholder are entirely normal -- there
 * is no store on an emulator anyway.
 *
 * `-PallowPlaceholderStoreKey` overrides it, for the one build that legitimately
 * needs the placeholder: Play only exposes Monetise -> Products after a bundle
 * declaring `com.android.vending.BILLING` has been uploaded to a track, and the
 * products have to exist before RevenueCat can import them and issue the key.
 * That build is deliberately unshippable, so the override is a flag you have to
 * type rather than something that can happen by accident.
 */
tasks.register('verifyReleaseStoreKeys') {
    description = 'Fails the release build if the RevenueCat placeholder key is still bundled.'
    def assetsDir = file('src/main/assets/public')

    doLast {
        if (!assetsDir.exists()) {
            throw new GradleException(
                "No synced web assets at ${assetsDir}.\n" +
                "Run:  npm run build && npx cap sync android")
        }

        def offenders = []
        assetsDir.eachFileRecurse { f ->
            if (f.isFile() && f.name.endsWith('.js') && f.text.contains('goog_XXXXX')) {
                offenders << f.name
            }
        }

        if (!offenders.isEmpty() && project.hasProperty('allowPlaceholderStoreKey')) {
            logger.lifecycle(
                "\nverifyReleaseStoreKeys: placeholder key allowed by " +
                "-PallowPlaceholderStoreKey.\n" +
                "This bundle CANNOT complete a purchase. It is good for one thing:\n" +
                "uploading to a track so Play exposes Monetise -> Products.\n")
            return
        }

        if (!offenders.isEmpty()) {
            throw new GradleException(
                "Release blocked: the RevenueCat Android key is still the placeholder.\n\n" +
                "  Found goog_XXXXX in: ${offenders.join(', ')}\n\n" +
                "  1. Put the real key in src/app/core/config/store.config.ts\n" +
                "     (RevenueCat -> Project settings -> API keys -> Public app keys)\n" +
                "  2. npm run build && npx cap sync android\n" +
                "  3. Rebuild.\n\n" +
                "  A bundle built now would install, sign and upload cleanly, and\n" +
                "  every purchase button in it would silently do nothing.")
        }
    }
}

// Both the bundle (.aab, what Play takes) and the APK path, so neither route
// out of this project can skip the check.
tasks.configureEach { t ->
    if (t.name in ['packageReleaseBundle', 'packageRelease']) {
        t.dependsOn 'verifyReleaseStoreKeys'
    }
}


repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
