<div *ngIf="file" class="file-preview-card" [class.compact]="compact">
  <!-- THUMBNAIL / PREVIEW BOX -->
  <div
    class="preview-thumbnail-container"
    [class.clickable]="showPreviewBtn"
    (click)="onThumbnailClick()"
    title="Click to preview">
    
    <!-- Image / PDF Thumbnail -->
    <img
      *ngIf="thumbnailUrl"
      [src]="thumbnailUrl"
      [alt]="file.name"
      class="thumbnail-image" />

    <!-- Fallback Icon if no thumbnail -->
    <div *ngIf="!thumbnailUrl" class="fallback-icon-box" [class.pdf]="isPdf" [class.image]="isImage">
      <svg *ngIf="isPdf" viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
      <svg *ngIf="!isPdf && isImage" viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <polyline points="21 15 16 10 5 21"></polyline>
      </svg>
      <svg *ngIf="!isPdf && !isImage" viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
      </svg>
    </div>

    <!-- Quick Preview Hover Overlay -->
    <div *ngIf="showPreviewBtn" class="thumb-hover-overlay">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
    </div>
  </div>

  <!-- FILE DETAILS -->
  <div class="file-info-container">
    <div class="file-name-row">
      <strong class="file-name" [title]="file.name">{{ file.name }}</strong>
      <app-badge *ngIf="formatBadge" [variant]="badgeVariant" size="sm">
        {{ formatBadge }}
      </app-badge>
    </div>

    <div class="file-meta-row">
      <span class="file-size">
        {{ (file.size / 1024) | number:'1.0-1' }} KB
        <span *ngIf="file.size >= 1048576" class="size-mb">
          ({{ (file.size / 1048576) | number:'1.1-2' }} MB)
        </span>
      </span>

      <span *ngIf="dimensions" class="meta-dot">&bull;</span>
      <span *ngIf="dimensions" class="meta-dimensions">
        {{ dimensions.width }} &times; {{ dimensions.height }} px
      </span>

      <span *ngIf="pageCount && pageCount > 0" class="meta-dot">&bull;</span>
      <span *ngIf="pageCount && pageCount > 0" class="meta-pages">
        {{ pageCount }} {{ pageCount === 1 ? 'page' : 'pages' }}
      </span>
    </div>
  </div>

  <!-- ACTIONS -->
  <div class="file-actions-container">
    <app-button
      *ngIf="showPreviewBtn"
      variant="outline"
      size="sm"
      (clicked)="preview.emit()"
      title="Preview file">
      <svg icon-start viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" style="margin-right: 4px;">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
      Preview
    </app-button>

    <app-button
      *ngIf="showReplaceBtn"
      variant="ghost"
      size="sm"
      (clicked)="replace.emit()"
      title="Choose another file">
      <svg icon-start viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" style="margin-right: 4px;">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
      </svg>
      Replace
    </app-button>

    <button
      *ngIf="showRemoveBtn"
      type="button"
      class="remove-icon-btn"
      (click)="remove.emit()"
      title="Remove file"
      aria-label="Remove file">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.2" fill="none">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>
</div>
