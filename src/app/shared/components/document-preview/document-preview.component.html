<div class="document-preview-root">
  <!-- If PDF -->
  @if (isPdf) {
    <app-pdf-preview
      [pdfFile]="file"
      [arrayBuffer]="pdfArrayBuffer"
      [overlays]="overlays"
      [isModal]="isModal"
      (closed)="closed.emit()">
    </app-pdf-preview>
  }

  <!-- If Image -->
  @if (isImage && imageUrl) {
    <app-image-preview
      [src]="imageUrl"
      [title]="title || file?.name"
      [fileSize]="file?.size"
      [isModal]="isModal"
      (closed)="closed.emit()">
    </app-image-preview>
  }

  <!-- Fallback if neither -->
  @if (!isPdf && (!isImage || !imageUrl)) {
    <div class="preview-empty-fallback">
      <svg viewBox="0 0 24 24" width="36" height="36" stroke="currentColor" stroke-width="1.8" fill="none">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
      </svg>
      <p>No preview available for this document.</p>
    </div>
  }
</div>
