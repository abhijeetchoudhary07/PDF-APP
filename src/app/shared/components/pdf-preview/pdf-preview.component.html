<div class="pdf-preview-container" [class.as-modal]="isModal">
  <!-- TOP TOOLBAR -->
  <div class="pdf-toolbar">
    <!-- Page Navigation -->
    <div class="toolbar-nav">
      <button
        type="button"
        class="nav-btn"
        (click)="prevPage()"
        [disabled]="currentPage <= 1 || isLoading"
        title="Previous page">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <span class="page-indicator">
        Page <strong>{{ currentPage }}</strong> of {{ totalPages }}
      </span>

      <button
        type="button"
        class="nav-btn"
        (click)="nextPage()"
        [disabled]="currentPage >= totalPages || isLoading"
        title="Next page">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>

    <!-- Zoom & Actions -->
    <div class="toolbar-actions">
      <div class="zoom-group">
        <button
          type="button"
          class="zoom-btn"
          (click)="zoomOut()"
          [disabled]="scale <= 0.5"
          title="Zoom out">
          <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
          </svg>
        </button>

        <button type="button" class="zoom-reset-btn" (click)="resetZoom()" title="Reset to 100%">
          {{ (scale * 100) | number:'1.0-0' }}%
        </button>

        <button
          type="button"
          class="zoom-btn"
          (click)="zoomIn()"
          [disabled]="scale >= 2.5"
          title="Zoom in">
          <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="11" y1="8" x2="11" y2="14"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
          </svg>
        </button>
      </div>

      @if (isModal) {
        <button
          type="button"
          class="close-modal-btn"
          (click)="closed.emit()"
          title="Close preview">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      }
    </div>
  </div>

  <!-- CANVAS WRAPPER -->
  <div class="pdf-canvas-wrapper">
    @if (isLoading) {
      <div class="canvas-loading-overlay">
        <div class="loading-spinner"></div>
        <span>Rendering page {{ currentPage }}...</span>
      </div>
    }

    @if (error) {
      <div class="canvas-error-box">
        <p>{{ error }}</p>
      </div>
    }

    <div class="canvas-shadow-box">
      <canvas #pdfCanvas class="rendered-canvas"></canvas>
    </div>
  </div>
</div>
