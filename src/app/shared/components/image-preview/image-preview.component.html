<div class="image-preview-wrapper" [class.as-modal]="isModal">
  <!-- TOP TOOLBAR -->
  <div class="preview-toolbar">
    <div class="toolbar-left">
      @if (title) {
        <span class="preview-title">{{ title }}</span>
      }
      <div class="meta-badges">
        @if (format) {
          <app-badge variant="primary" size="sm">{{ format }}</app-badge>
        }
        @if (dimensions) {
          <span class="meta-tag">
            {{ dimensions.width }} &times; {{ dimensions.height }} px
          </span>
        }
        @if (fileSize) {
          <span class="meta-tag">
            {{ (fileSize / 1024) | number:'1.0-1' }} KB
          </span>
        }
      </div>
    </div>

    <div class="toolbar-right">
      <!-- Zoom Controls -->
      @if (zoomable) {
        <div class="zoom-controls">
          <button
            type="button"
            class="tool-btn"
            (click)="zoomOut()"
            [disabled]="zoomLevel <= MIN_ZOOM"
            title="Zoom out">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              <line x1="8" y1="11" x2="14" y2="11"></line>
            </svg>
          </button>
          <button type="button" class="zoom-level-btn" (click)="resetZoom()" title="Reset to 100%">
            {{ (zoomLevel * 100) | number:'1.0-0' }}%
          </button>
          <button
            type="button"
            class="tool-btn"
            (click)="zoomIn()"
            [disabled]="zoomLevel >= MAX_ZOOM"
            title="Zoom in">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              <line x1="11" y1="8" x2="11" y2="14"></line>
              <line x1="8" y1="11" x2="14" y2="11"></line>
            </svg>
          </button>
        </div>
      }

      <!-- Close Button (if modal) -->
      @if (isModal) {
        <button
          type="button"
          class="tool-btn close-btn"
          (click)="closed.emit()"
          title="Close preview">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      }
    </div>
  </div>

  <!-- IMAGE CANVAS / VIEWPORT -->
  <div class="image-viewport">
    <div
      class="canvas-checkerboard"
      [style.transform]="'scale(' + zoomLevel + ')'"
      [style.transformOrigin]="'center center'">
      <img
        [src]="src"
        [alt]="alt"
        class="preview-img"
        loading="lazy" />
    </div>
  </div>
</div>
